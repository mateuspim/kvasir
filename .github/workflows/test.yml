name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same offline suite as `make test`: renders compose client-side,
      # needs no GPU and no running containers.
      - run: ./scripts/test_config.sh
      - run: shellcheck scripts/*.sh
