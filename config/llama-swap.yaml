# llama-swap: one OpenAI-compatible endpoint, models loaded on demand.
#
# Target hardware: RTX 4080 (16 GB VRAM) + Ryzen 9 9900X + 60 GB RAM.
#
# TUNED 2026-08-03. Measured: 87.4 tok/s generation on the 35B at 128K context,
# 14256/16376 MiB VRAM. See CLAUDE.md for the full sweep.
#
# Deliberately absent: --n-gpu-layers and --n-cpu-moe. Setting either one makes
# llama.cpp abort its own memory fitting ("n_gpu_layers already set by user,
# abort") and fall back to whatever you hard-coded, which OOMs at this context
# length. Left alone, common_fit_params computes the split at load time and
# gets it right. Do not "helpfully" add -ngl 999 back.

healthCheckTimeout: 600
logLevel: info

macros:
  # Shared across every model. --jinja is default-on in b10236 but is stated
  # explicitly because tool calling silently degrades without it.
  server: >
    /app/llama-server
    --host 0.0.0.0
    --port ${PORT}
    --jinja
    --flash-attn on
    --cache-type-k q8_0
    --cache-type-v q8_0

  # Unsloth's documented sampler for *precise coding* on Qwen3.6 thinking mode.
  # Differs from their general-purpose preset only in temperature (1.0 -> 0.6).
  qwen-coding-sampler: >
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0.0

models:
  # ---------------------------------------------------------------- primary --
  # 35B total / ~3B active. Q4_K_XL is ~23 GB against 16 GB of VRAM, so expert
  # tensors spill to RAM via --n-cpu-moe. Because only ~3B params are active per
  # token, that spill is cheap -- this is exactly why the MoE beats the dense
  # 27B on this card despite scoring lower on paper.
  "qwen3.6-35b":
    cmd: |
      ${server}
      ${qwen-coding-sampler}
      --model /models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --mmproj /models/mmproj-F16.gguf
      --ctx-size 131072
      --spec-type draft-mtp
      --spec-draft-n-max 2
    ttl: 900
    aliases:
      - qwen
      - default

  # ------------------------------------------------------------ fast / subagent --
  # Fits entirely in VRAM with room for KV cache. For subagents, summarisation,
  # and high-volume mechanical edits where latency beats depth.
  # 12.11 GB weights + 0.92 GB eagle3 draft head = ~13 GB, leaving ~3 GB for KV.
  # ggml-org ships a matched eagle3 draft model, so this tier gets speculative
  # decoding too -- the equivalent of MTP for a model that has no MTP head.
  "gpt-oss-20b":
    cmd: |
      ${server}
      --model /models/gpt-oss-20b-MXFP4.gguf
      --ctx-size 65536
      --spec-type draft-eagle3
      --spec-draft-model /models/eagle3-gpt-oss-20b-Q8_0.gguf
      --spec-draft-n-max 3
    ttl: 600
    aliases:
      - fast

  # -------------------------------------------------------------- quality tier --
  # Deliberately NOT defined. The dense Qwen3.6-27B scores higher on paper
  # (77.2 vs 73.4 SWE-bench Verified) but at Q3 it needs ~14.8 GB of a 16.4 GB
  # card, leaving almost nothing for KV cache -- hence a 32K context ceiling with
  # no room to grow. Being dense it also cannot spill experts to RAM cheaply the
  # way the A3B MoE does, so it is both more cramped and slower here.
  #
  # It was previously advertised with no weights on disk, which just returned
  # 500s to anything that asked for it. To actually add it: uncomment the
  # [QUALITY] line in models.conf, run `make models`, then restore a block here
  # modelled on the 35B above.
