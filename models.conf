# GGUF download manifest. Same INI shape as the ComfyUI project's models.conf:
# one `filename = url` per line, sections are informational tiers.
# Comment out a line to skip that download.
#
# Sizes verified against the HuggingFace API on 2026-08-03.
# Everything here is Apache-2.0 and needs no HF token.

[PRIMARY]
# Qwen3.6-35B-A3B, 35B total / ~3B active, 256K context, multimodal.
# Pulled from the -MTP- repo (note: the *files* inside it carry no MTP infix)
# because that build includes the multi-token-prediction head, worth 1.4-2.2x
# generation speed via --spec-type draft-mtp.
Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf = https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf  # 22.85 GB

[FAST]
# gpt-oss-20b plus its matched eagle3 draft head for speculative decoding.
gpt-oss-20b-MXFP4.gguf     = https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-MXFP4.gguf       # 12.11 GB
eagle3-gpt-oss-20b-Q8_0.gguf = https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/main/eagle3-gpt-oss-20b-Q8_0.gguf  # 0.92 GB

[VISION]
# Enables image input on the Qwen3.6 models -- they are natively multimodal,
# this projector is all that was missing. Note --mmproj-auto cannot fetch this
# itself because /models is bind-mounted read-only into the container.
mmproj-F16.gguf = https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/main/mmproj-F16.gguf  # 0.90 GB

[QUALITY]
# Optional dense 27B: better on paper (77.2 vs 73.4 SWE-bench Verified) but all
# 27B params are read per token, so on a 16 GB card it only makes sense at Q3
# fully resident in VRAM. Slower than the MoE. Uncomment if you want the tier.
# Qwen3.6-27B-UD-Q3_K_XL.gguf = https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF/resolve/main/Qwen3.6-27B-UD-Q3_K_XL.gguf  # 14.79 GB

[FALLBACK]
# Smaller quant of the primary, if 22.85 GB turns out to spill too far into RAM
# and `make tune` shows unacceptable speed. Fits VRAM far better at some
# quality cost. Uncomment only if tuning says you need it.
# Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf = https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf  # 17.23 GB
