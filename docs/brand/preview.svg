  </pattern>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#b48cff"/><stop offset="1" stop-color="#b48cff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-.2" y="-.2" width="1.5" height="1.6"><feGaussianBlur stdDeviation="45"/></filter>
</defs>
